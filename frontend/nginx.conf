server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 26m;
  client_body_timeout 20s;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'" always;
  location /api/ {
    proxy_pass http://backend:4000;
    proxy_read_timeout 100s;
    proxy_send_timeout 100s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /assets/ { try_files $uri =404; expires 1y; }
  location / { try_files $uri $uri/ /index.html; }
}
