name: Validate editor and conversion
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node scripts/verify-export-worker.mjs
      - name: Start real converter
        run: docker compose up -d
      - name: Wait for converter
        run: |
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3001/health; then exit 0; fi
            sleep 2
          done
          docker compose logs gotenberg
          exit 1
      - run: npm run test:conversion
      - name: Stop converter
        if: always()
        run: docker compose down
